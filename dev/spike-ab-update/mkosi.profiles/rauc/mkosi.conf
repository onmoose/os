# SPIKE (#485), not for merge. RAUC with GRUB on BOTH firmwares.
#
# GRUB boots the box under UEFI (grub x86_64-efi) and under legacy BIOS
# (grub i386-pc) from one grub.cfg and one grubenv on the ESP. RAUC's GRUB
# backend keeps the slot order and the boot attempts in that grubenv, so the
# rollback path is the same on both firmwares.
#
# The kernel and initrd live inside each root slot (/usr/lib/spike/boot/), so
# a slot is one self-contained unit: RAUC writes the root, and the kernel comes
# with it. GRUB reads them from the slot's ext4.

[Content]
Bootloader=grub
BiosBootloader=grub
UnifiedKernelImages=no
KernelCommandLine=console=tty0 console=ttyS0 rw init=/usr/lib/spike/init panic=10
Packages=
        rauc
        rauc-service
        grub-common
        grub-pc-bin
        grub-efi-amd64-bin
        initramfs-tools
