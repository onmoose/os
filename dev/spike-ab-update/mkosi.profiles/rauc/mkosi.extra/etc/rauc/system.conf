# SPIKE (#485), not for merge.
[system]
compatible=moose-spike
bootloader=grub
grubenv=/efi/grub/grubenv
data-directory=/data/rauc
bundle-formats=-plain

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/disk/by-partuuid/a0a0a0a0-0000-4000-8000-00000000000a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partuuid/b0b0b0b0-0000-4000-8000-00000000000b
type=ext4
bootname=B
