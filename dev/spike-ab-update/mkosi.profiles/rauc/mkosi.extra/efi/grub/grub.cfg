# SPIKE (#485), not for merge. One config for UEFI and legacy BIOS.
#
# Slot choice is RAUC's reference GRUB script (contrib/grub.conf): take the
# first slot in ORDER with <slot>_OK=1 and <slot>_TRY=0, and set its TRY to 1
# before booting it. The booted system clears TRY with `rauc status mark-good`
# once it is healthy. A slot that never gets there keeps TRY=1, so on the next
# boot GRUB skips it and boots the other slot. One attempt per update.
#
# mkosi appends its own menu entries below this file. They come after ours,
# so they are never the default.
set timeout=0
set default=0

insmod regexp
insmod ext2
insmod loadenv
insmod test

# $root is the ESP here. Its disk is the boot disk, whatever the firmware
# calls it, so the slots are found as partitions 3 and 4 of that same disk.
regexp --set=1:spike_disk '^([^,]+),' "$root"

set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
load_env

set spike_found=0
for SLOT in $ORDER; do
    if [ "$SLOT" == "A" ]; then
        INDEX=0
        OK=$A_OK
        TRY=$A_TRY
        A_TRY=1
    fi
    if [ "$SLOT" == "B" ]; then
        INDEX=1
        OK=$B_OK
        TRY=$B_TRY
        B_TRY=1
    fi
    if [ "$OK" -eq 1 -a "$TRY" -eq 0 ]; then
        default=$INDEX
        spike_found=1
        break
    fi
done

# No slot is left to try. RAUC's script falls to a rescue slot here. We have
# none, so reset the attempts of the good slots and boot the first one, rather
# than stopping at a GRUB prompt that nobody will ever see.
if [ "$spike_found" -eq 0 ]; then
    if [ "$A_OK" -eq 1 ]; then A_TRY=0; default=0; fi
    if [ "$B_OK" -eq 1 ]; then B_TRY=0; if [ "$A_OK" -ne 1 ]; then default=1; fi; fi
fi

save_env A_TRY A_OK B_TRY B_OK ORDER

set spike_cmdline="rw console=tty0 console=ttyS0 init=/usr/lib/spike/init panic=10"

menuentry "moose slot A" {
    set root=($spike_disk,gpt3)
    linux /usr/lib/spike/boot/vmlinuz root=PARTUUID=a0a0a0a0-0000-4000-8000-00000000000a $spike_cmdline rauc.slot=A
    initrd /usr/lib/spike/boot/initrd.img
}

menuentry "moose slot B" {
    set root=($spike_disk,gpt4)
    linux /usr/lib/spike/boot/vmlinuz root=PARTUUID=b0b0b0b0-0000-4000-8000-00000000000b $spike_cmdline rauc.slot=B
    initrd /usr/lib/spike/boot/initrd.img
}
