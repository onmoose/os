# SPIKE (#485), not for merge. systemd-sysupdate with systemd-boot and UKIs.
#
# UEFI only. Rollback is systemd-boot boot counting: a new UKI is installed as
# moose-spike_<v>+1.efi, systemd-boot counts the attempt down when it boots
# it, and systemd-bless-boot drops the counter once boot-complete.target is
# reached. A UKI at +0 that was never blessed sorts last, so the previous
# version boots. Legacy BIOS has no systemd-boot, so none of this exists
# there. That is the finding, and this profile does not try to fake it.
#
# Debian does not ship systemd-sysupdate. build.sh builds it
# (sysupdate/build-sysupdate.sh) and drops it into this profile's extra tree.
# build.sh also writes mkosi.repart/20-root.conf, because the slot's label
# carries the version (moose-spike_<v>) and sysupdate matches on it.

[Output]
SplitArtifacts=uki

[Content]
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
UnifiedKernelImageFormat=moose-spike_%v
KernelCommandLine=console=tty0 console=ttyS0 rw init=/usr/lib/spike/init panic=10
Packages=
        systemd-boot
        systemd-boot-efi
        systemd-container
