# SPIKE (#485), not for merge. Shared base for both A/B engines.
#
# A small trixie box with Docker and sqlite3, and no control plane. It
# carries only what the four proofs need. The engine-specific parts are the
# mkosi profiles: mkosi.profiles/rauc and mkosi.profiles/sysupdate.
#
# Disk layout (the same for both engines, so the proofs compare like with like):
#   1 ESP            512M  (in the image)
#   2 BIOS boot      1M    (in the image)
#   3 root slot A    fixed (in the image, holds v1)
#   4 root slot B    fixed (made by systemd-repart at first boot)
#   5 data           rest  (made and grown by systemd-repart at first boot)
# Slot B and the data partition are not in the image on purpose (proof 1).

[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=disk
ImageId=moose-spike
ManifestFormat=json
SplitArtifacts=partitions

[Build]
ToolsTree=default
ToolsTreeRelease=trixie
Incremental=yes

[Content]
WithRecommends=no
Bootable=yes
KernelModulesInitrd=yes
KernelModulesInitrdInclude=virtio.*
KernelModulesInitrdInclude=sd_mod
KernelModulesInitrdInclude=ext4
KernelModulesInitrdInclude=jbd2
KernelModulesInitrdInclude=mbcache
KernelModulesInitrdInclude=crc32c.*
KernelModulesInitrdInclude=overlay
Packages=
        linux-image-amd64
        systemd
        systemd-sysv
        systemd-repart
        ca-certificates
        dbus
        util-linux
        kmod
        udev
        e2fsprogs
        dosfstools
        iproute2
        openssh-server
        passwd
        bash
        grep
        sed
        gawk
        coreutils
        sqlite3
        busybox-static
        docker.io
        docker-cli
        containerd
        runc

[Runtime]
KVM=yes
RAM=2G
