#!/usr/sbin/nft -f
#
# moose appliance — scope SSH (:22) to the LAN and the mesh. #467; BUILD.md # SSH,
# AUTH.md # Device access.
#
# Two controls sit on :22 and they answer different questions. The daemon decides
# whether the port answers at all: sshd is stopped until an account turns SSH on
# (BUILD.md # SSH). This rule decides who may reach it while it does answer. They
# are complementary, not alternatives — the hosted profile has only the first,
# because it has neither a LAN nor a mesh to scope to.
#
# SSH from the public internet is blocked STRUCTURALLY, not by per-account opt-in
# alone. A scan from outside sees a closed port, not a refused-auth banner. The
# path to "SSH to my box from outside" is "pair the device on the mesh", which is
# the same trust model the user already learns for the dashboard.
#
# Source IP, not a NIC name, on purpose: the box changes NICs (ethernet to WiFi,
# a bridge added later) without the rule following. `iif lo` keeps a local client
# — the box talking to itself — working regardless.
#
# BOTH FAMILIES ARE MATCHED, and that is not decoration. In an `inet` table an
# `ip saddr` expression compiles to an nfproto==IPv4 test before the address
# compare, so it can never match an IPv6 packet. With only the RFC1918 accepts
# below, every IPv6 connection would fall past them into the final drop — and a
# LAN client resolving the box over mDNS very often gets an AAAA record, so
# `ssh moose.local` from the sofa would simply hang. The v6 accepts are what keep
# the rule about WHERE the client is instead of which family it happened to pick.
#
# The v6 side allows link-local (fe80::/10) and unique-local (fc00::/7) only.
# Those are the two ranges that cannot be routed in from outside, so they are the
# honest translation of "RFC1918 = the LAN". A globally-routable v6 address is
# NOT allowed, even from a machine sitting on the same LAN: the whole point of
# this rule is that a scan from the public internet sees a closed port, and v6
# GUAs are reachable from there. A dual-stack home network where the LAN peers
# only have GUAs is the case this does not cover, and BUILD.md # SSH has no
# answer for it — RFC1918 has no v6 equivalent. That is an open design item
# (NEXT.md # SSH scoping on a dual-stack LAN), not something to settle by
# widening the rule here. Link-local always exists on a LAN interface, so the
# path stays open in the meantime.
#
# THE MESH INTERFACE IS NOT NAMED HERE YET. The rule BUILD.md specifies also
# allows the mesh interface (tailscale0 / headscale0) when a mesh client is
# installed, and the name is filled in at host-agent startup from whichever client
# is present. v1 installs no mesh client (remote access is user-opt-in Tailscale,
# SERVICE_PROVISIONING.md; the moose mesh is deferred), so there is no interface
# to name and the LAN half is the whole of the rule today. The fill-in lands with
# the mesh client, not before.
#
# CONTAINERS ARE NOT THE LAN, and the private ranges alone do not say so.
# Docker's default address pool is carved out of 172.17.0.0/16 upward, which sits
# inside the 172.16.0.0/12 accepted below — so without the drop that comes first,
# a compromised app container could reach the box's own sshd on the bridge and sit
# in front of the authentication surface this rule exists to keep off it
# (THREAT_MODEL.md, adversary: compromised app at runtime). The perimeter is meant
# to be "devices on the household LAN or paired on the mesh", and a container is
# neither.
#
# Matched by input interface rather than by subnet, because the interface is exact
# and the subnet is not: excluding 172.17.0.0/16 by address would also lock out a
# household that genuinely numbers its LAN there, while a packet from a container
# always arrives on a Docker-managed bridge (docker0, or br-<hex> for a
# user-defined network — the veth is enslaved to the bridge, so the bridge is what
# the input hook sees). This is the same shape as the hosted metadata block, which
# separates container traffic from host traffic by the path it takes rather than
# by the address it carries.
#
# `br-*` is Docker's own naming for user-defined network bridges. moose creates no
# other interface by that name today; if it ever does, this pattern has to be
# narrowed rather than left to catch it.
#
# Own table at its own priority so loading it never flushes Docker's rules
# (separate nftables tables are independent), and `policy accept` so nothing but
# :22 is affected. The leading add-then-delete makes the unit idempotent: the add
# ensures the table exists so the delete cannot fail on a first, absent run.

add table inet moose_ssh
delete table inet moose_ssh

table inet moose_ssh {
	chain input {
		type filter hook input priority -100; policy accept;

		# Before every accept: a container is not a LAN device, and Docker's
		# bridges are numbered inside the RFC1918 ranges accepted below.
		tcp dport 22 iifname "docker0" drop
		tcp dport 22 iifname "br-*" drop

		tcp dport 22 iif lo accept
		tcp dport 22 ip saddr 10.0.0.0/8 accept
		tcp dport 22 ip saddr 172.16.0.0/12 accept
		tcp dport 22 ip saddr 192.168.0.0/16 accept
		tcp dport 22 ip6 saddr fe80::/10 accept
		tcp dport 22 ip6 saddr fc00::/7 accept
		tcp dport 22 counter drop
	}
}
