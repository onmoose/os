# Keep /run/sshd when moose stops the daemon. #467; BUILD.md # SSH.
#
# moose turns sshd off whenever the last account disables SSH, which is an
# ordinary event here rather than an administrator shutting a service down. Two
# facts about Debian's ssh.service collide with that:
#
#   - it declares RuntimeDirectory=sshd, so systemd DELETES /run/sshd when the
#     unit stops;
#   - sshd refuses to read a config without that directory ("Missing privilege
#     separation directory: /run/sshd"), and host-agent validates every rendered
#     drop-in with `sshd -t` before it starts anything.
#
# So after the first disable, `sshd -t` fails and NO account can turn SSH on
# again until the box reboots. The first enable after a boot works, which is what
# makes this easy to miss: /run/sshd is created at boot by openssh's tmpfiles rule
# (/usr/lib/tmpfiles.d/20-systemd-ssh-generator.conf), and only the stop removes
# it. Found by the cloud lane's ssh boot, which enables, disables, and enables
# again — the third step is the regression test.
#
# Preserving the directory costs an empty 0755 dir on a box that never uses SSH.
# It is not a port and grants nothing; the daemon's run state is still the whole
# of the port control.
[Service]
RuntimeDirectoryPreserve=yes
