# moose appliance — sshd hardening. #467; BUILD.md # SSH, AUTH.md # Device access.
#
# Static, and separate from the drop-in host-agent renders. moose-allowed.conf is
# a projection of the enabled set and is rewritten whole on every change; these two
# settings must hold whether or not any account has SSH on, so they live in their
# own file that nothing generates.
#
# PasswordAuthentication yes is a PREREQUISITE, not a grant. It is what allows the
# password half of an account's AuthenticationMethods to be offered at all. On its
# own it lets nobody in: an account is considered only if it is named in the
# AllowUsers line moose-allowed.conf renders, and its Match block there says which
# factors it must present. An account whose mandatory factor is the key is
# `publickey`; one that added the optional second lock is `publickey,password`, and
# sshd demands both, so neither alone authenticates.
#
# sshd takes the FIRST value it obtains for a keyword and reads
# sshd_config.d/*.conf in filename order. Both keywords are repeated in
# moose-allowed.conf, which sorts before this file, so the rendered drop-in wins
# for them. That is deliberate and harmless — it renders the same two values — and
# this file is what states them while no account is enabled and nothing is rendered.
PermitRootLogin no
PasswordAuthentication yes
