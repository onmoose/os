# PROBE #564. dev/cloud's grub.cfg, read by Debian's signed GRUB (shim ->
# grubx64.efi, prefix /EFI/debian) with Secure Boot on. Differences from
# hosted: the grubenv is $prefix/grubenv (/EFI/debian/grubenv), every insmod
# is checked and echoed, and the kernel gets the slot's verity root hash
# from the grubenv (<slot>_ROOTHASH) and root=/dev/mapper/moose-root.
set timeout=0
set default=0

echo "moose-grub: start prefix=$prefix root=$root cmdpath=$cmdpath lockdown=$lockdown shim_lock=$shim_lock"
for m in regexp loadenv test part_gpt squash4 xzio; do
    if insmod $m; then
        echo "moose-grub: insmod $m ok"
    else
        echo "moose-grub: insmod $m FAILED"
    fi
done

regexp --set=1:moose_disk '^([^,]+),' "$root"
echo "moose-grub: disk=$moose_disk"

set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
set A_ROOTHASH=""
set B_ROOTHASH=""
if load_env; then
    echo "moose-grub: load_env ok ORDER=$ORDER A_OK=$A_OK A_TRY=$A_TRY B_OK=$B_OK B_TRY=$B_TRY"
else
    echo "moose-grub: load_env FAILED"
fi

set moose_found=0
for SLOT in $ORDER; do
    if [ "$SLOT" == "A" ]; then
        INDEX=0
        OK=$A_OK
        TRY=$A_TRY
        A_TRY=1
    fi
    if [ "$SLOT" == "B" ]; then
        INDEX=1
        OK=$B_OK
        TRY=$B_TRY
        B_TRY=1
    fi
    if [ "$OK" -eq 1 -a "$TRY" -eq 0 ]; then
        default=$INDEX
        moose_found=1
        break
    fi
done

if [ "$moose_found" -eq 0 ]; then
    moose_fallback=""
    for SLOT in $ORDER; do
        if [ "$SLOT" == "A" -a "$A_OK" -eq 1 ]; then moose_fallback=A; fi
        if [ "$SLOT" == "B" -a "$B_OK" -eq 1 ]; then moose_fallback=B; fi
    done
    echo "moose-grub: no slot left to try, fallback=$moose_fallback"
    if [ "$moose_fallback" == "A" ]; then A_TRY=0; default=0; fi
    if [ "$moose_fallback" == "B" ]; then B_TRY=0; default=1; fi
fi

if save_env A_TRY A_OK B_TRY B_OK ORDER; then
    echo "moose-grub: save_env ok default=$default A_TRY=$A_TRY B_TRY=$B_TRY"
else
    echo "moose-grub: save_env FAILED"
fi

set moose_cmdline="ro console=tty0 console=ttyS0 psi=1 panic=10 fsck.mode=skip root=/dev/mapper/moose-root"

menuentry "moose slot A" {
    set root=($moose_disk,gpt2)
    echo "moose-grub: loading slot A kernel from ($moose_disk,gpt2)"
    linux /usr/lib/moose/boot/vmlinuz $moose_cmdline moose.slotuuid=20202020-2020-4020-8020-202020202020 moose.roothash=$A_ROOTHASH rauc.slot=A
    echo "moose-grub: slot A kernel loaded"
    initrd /usr/lib/moose/boot/initrd.img
    echo "moose-grub: slot A initrd loaded"
}

menuentry "moose slot B" {
    set root=($moose_disk,gpt3)
    echo "moose-grub: loading slot B kernel from ($moose_disk,gpt3)"
    linux /usr/lib/moose/boot/vmlinuz $moose_cmdline moose.slotuuid=21212121-2121-4121-8121-212121212121 moose.roothash=$B_ROOTHASH rauc.slot=B
    echo "moose-grub: slot B kernel loaded"
    initrd /usr/lib/moose/boot/initrd.img
    echo "moose-grub: slot B initrd loaded"
}
