# PROBE #564. Slot A: squashfs-xz, kernel and initramfs inside. 2G here only so
# the full appliance set always fits for the size measurement; the share of a
# 1 GiB slot is reported. The verity hash tree is appended by run.sh.
[Partition]
Type=root
Label=moose-slot-a
UUID=20202020-2020-4020-8020-202020202020
Format=squashfs
Compression=xz
CopyFiles=/
ExcludeFiles=/efi/
SizeMinBytes=2G
SizeMaxBytes=2G
