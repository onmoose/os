# PROBE for #564 (dropped before the PR). The appliance package set in the A/B
# slot shape, booted through shim and Debian's signed GRUB with Secure Boot on,
# with a dm-verity root opened in the initramfs. Built and booted only in CI
# (.github/workflows/probe-564-appliance.yml). Never published.
[Distribution]
Distribution=debian
Release=trixie
Repositories=non-free-firmware

[Output]
Format=disk
ImageId=moose-probe
OutputDirectory=../../.dev/probe-564
ManifestFormat=json
SectorSize=512

[Build]
CacheDirectory=../../.dev/probe-564/cache
ToolsTree=default
ToolsTreeRelease=trixie

[Content]
WithRecommends=no
# shim and the signed GRUB are put on the ESP by the postinst, not by mkosi:
# the kernel lives in the slot, so mkosi would find no kernel and skip shim.
Bootable=auto
Bootloader=none
BiosBootloader=none
UnifiedKernelImages=no
Packages=
        linux-image-amd64
        systemd
        systemd-sysv
        systemd-repart
        systemd-cryptsetup
        udev
        dbus
        kmod
        util-linux
        e2fsprogs
        initramfs-tools
# Secure Boot chain: shim (signed by Microsoft) and GRUB and the kernel (signed by Debian).
        shim-signed
        shim-helpers-amd64-signed
        grub-efi-amd64-signed
        grub-common
# dm-verity and LUKS, TPM.
        cryptsetup
        cryptsetup-bin
        tpm2-tools
# RAUC, as on hosted.
        rauc
        rauc-service
# The rest of the appliance set (BUILD.md # 1 # Preinstalled packages, dev/test-qemu/mkosi.conf).
        openssh-server
        nftables
        ca-certificates
        iproute2
        network-manager
        wpasupplicant
        avahi-daemon
        avahi-utils
        samba
        mergerfs
        lvm2
        curl
        sudo
        passwd
        bash
        less
        grep
        sed
        gawk
        coreutils
        tzdata
        firmware-linux
        firmware-iwlwifi
        firmware-realtek
        firmware-amd-graphics
        firmware-misc-nonfree
        docker-ce
        docker-ce-cli
        containerd.io
        docker-compose-plugin
ExtraTrees=mkosi.extra

[Runtime]
KVM=yes
