# BIOS Boot Partition (#277; BUILD.md # 1b, partition 2). On a GPT disk there
# is no MBR gap for GRUB's core.img, so it lives in a partition of this
# well-known type: grub-bios-setup embeds core.img here and writes boot.img to
# the protective MBR. Legacy BIOS (Hetzner CX) boots through it; UEFI boots
# GRUB from the ESP. Both read the same grub.cfg on the ESP. No Format=: the
# partition holds raw core.img, not a filesystem.
[Partition]
Type=21686148-6449-6e6f-744e-656564454649
SizeMinBytes=1M
SizeMaxBytes=1M
