# The ESP (BUILD.md # 1b, partition 1). It holds GRUB for UEFI, GRUB's
# modules for both firmwares, the one grub.cfg both firmwares read, and the
# grubenv where RAUC keeps the slot order. The label is what /etc/fstab mounts
# at /efi, where RAUC finds the grubenv.
#
# 128 MiB, and only /efi is copied in. The kernel and initramfs live inside
# each slot, never here: the postinst moves the kernel out of
# /usr/lib/modules, so mkosi finds no kernel to copy to the ESP and writes no
# menu entries of its own (mkosi.conf, Bootable=auto). What lands here is about
# 4 to 7 MB, so 128 MiB leaves room for GRUB to grow.
[Partition]
Type=esp
Label=esp
Format=vfat
CopyFiles=/efi:/
SizeMinBytes=128M
SizeMaxBytes=128M
