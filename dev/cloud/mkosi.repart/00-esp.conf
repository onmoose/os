# The ESP (BUILD.md # 1b, partition 1). It holds GRUB for UEFI, the one
# grub.cfg both firmwares read, and the grubenv where RAUC keeps the slot
# order. The label is what /etc/fstab mounts at /efi, where RAUC finds the
# grubenv. mkosi also copies its own kernel and initrd here and appends its own
# menu entries after ours; they are never the default and nothing uses them.
[Partition]
Type=esp
Label=esp
Format=vfat
CopyFiles=/boot:/
CopyFiles=/efi:/
SizeMinBytes=512M
SizeMaxBytes=512M
