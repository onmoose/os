# Slot A (BUILD.md # 1b, partition 3): one whole root, kernel and initramfs
# included (/usr/lib/moose/boot/). Slot B and the state partition are not in
# the image: systemd-repart makes them at first boot
# (mkosi.extra/usr/lib/repart.d/).
#
# 4 GiB, fixed for the life of the box: slot B is made right after slot A, so
# a slot can never grow later.
#
# The PARTUUID is pinned because grub.cfg boots root=PARTUUID=... (no gpt-auto,
# which needs an EFI loader variable this boot path does not set) and RAUC's
# system.conf names the slot by it. It is the UUID the single root had before
# the A/B layout.
#
# /efi is the ESP's mount point on the booted box, so only its contents are
# left out; the empty directory stays, because the slot is mounted read-only
# and cannot make it at boot.
[Partition]
Type=root
Label=moose-slot-a
UUID=20202020-2020-4020-8020-202020202020
Format=ext4
CopyFiles=/
ExcludeFiles=/efi/
SizeMinBytes=4G
SizeMaxBytes=4G
