# Slot A (BUILD.md # 1b, partition 3): one whole root, kernel and initramfs
# included (/usr/lib/moose/boot/). Slot B and the state partition are not in
# the image: systemd-repart makes them at first boot
# (mkosi.extra/usr/lib/repart.d/).
#
# A read-only squashfs, compressed with xz. GRUB 2.12 must read the kernel
# and initramfs from inside the slot, and squashfs-xz is the one compressed
# format it reads (it has no erofs driver, and no zstd for squashfs). The slot
# is never written by the box, so a read-only filesystem costs nothing.
#
# 1 GiB, fixed for the life of the box: slot B is made right after slot A, so
# a slot can never grow later. The build fails when the squashfs fills more
# than 60% of it (dev/cloud/slotbudget, BUILD.md # 1b # Disk budget).
#
# The PARTUUID is pinned because grub.cfg boots root=PARTUUID=... (no gpt-auto,
# which needs an EFI loader variable this boot path does not set) and RAUC's
# system.conf names the slot by it. It is the UUID the single root had before
# the A/B layout.
#
# /efi is the ESP's mount point on the booted box, so only its contents are
# left out; the empty directory stays, because the slot is read-only and
# cannot make it at boot.
[Partition]
Type=root
Label=moose-slot-a
UUID=20202020-2020-4020-8020-202020202020
Format=squashfs
Compression=xz
CopyFiles=/
ExcludeFiles=/efi/
SizeMinBytes=1G
SizeMaxBytes=1G
