# Test-only catalog app for the hosted cloud access boot (#604). The same
# filedrop fixture, but its documents grant starts at the Notebooks subfolder.
# It proves the exact #604 case: the folder the app binds is
# ~/Documents/Notebooks, and swapping that path for a symlink between two
# starts must be refused instead of binding the link's target.
#
# The image is baked into the offline bundle by digest, like whoami, and the
# lane installs air-gapped (MOOSE_OFFLINE_INSTALL), so the promised digest is
# the trust anchor (APP_LIFECYCLE.md # image digest pinning).
id: filedropsub
manifest_version: 1
name: Filedrop Sub
version: "1.37"
description:
  short: "Test fixture: writes one file into its Documents/Notebooks folder."
icon_glyph: flask-conical
compose_file: compose.yml
main_service: filedrop
main_port: 8080
preferred_slugs: [filedropsub]

permissions:
  internet: false
  lan: false
  folders:
    - folder: documents
      mode: write
      default: Notebooks

images:
  busybox:1.37.0:
    digest: sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    download_bytes: 2211514
    disk_bytes: 4421262
