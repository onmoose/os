# moose hosted cloud-image profile (C1b #203; first-boot wiring #242).
#
# The cloud-VM image definition for the *hosted* environment profile
# (ENVIRONMENT.md # How the profile is realized — "A lean cloud image
# profile"). It is NOT the appliance rootfs with services disabled: it is its
# own mkosi image that installs only what a cloud VM needs and never installs
# the appliance's LAN/storage machinery (absent, not disabled). mkosi stays the
# single image builder for every target (BUILD.md # 2, DECISIONS.md 2026-06-16);
# this is a second image *definition*, not a second builder.
#
# Lean PACKAGE cut (C1b, #203): only what a cloud VM needs — never the appliance's
# network-manager/avahi/samba/mergerfs/cryptsetup/tpm2 (the cuts the lean
# check asserts against the apt manifest). openssh-server IS carried (#467): SSH
# is a per-account opt-in on hosted too, with a public key as the mandatory factor
# (DECISIONS.md 2026-09-09). The daemon is installed and left STOPPED — see the
# ssh.service note in mkosi.postinst.chroot. On top of that lean base, #242 bakes the
# first-boot RUNTIME wiring — the slim host-agent (#204/C1c) + the control-plane
# images (#205/C2) + the seed/networkd/identity bring-up — so a box from
# `make build-cloud-image` self-bootstraps on a real cloud instead of booting to an
# empty, network-less docker host. The wiring adds no apt packages, so the image
# stays lean by the manifest. The wiring is GENERATED into mkosi.extra.wiring/ +
# enabled by mkosi.postinst.chroot (see those + dev/cloud/stage-control-plane.sh).
#
# Read by `mkosi build` from dev/cloud/bootstrap.sh, which stages the wiring + the
# Docker apt repo (auto-detected mkosi.pkgmngr/ tree) first. Output is a raw GPT
# disk image; the qcow2 + serial boot proof are the test lane (dev/cloud/test/).

[Distribution]
# Every package version is locked (#560, BUILD.md # 1b # The OS package lock).
# bootstrap.sh passes --snapshot from dev/os-lock/debian-snapshot, so Debian and
# debian-security come from snapshot.debian.org at that moment, and the build
# fails if the resolved list differs from dev/os-lock/cloud-packages.lock. It is
# a CLI flag, not Snapshot= here, so the timestamp lives in one file under
# dev/os-lock/ that the bump workflow rewrites.
Distribution=debian
# Debian 13 "Trixie" — the locked product base (BUILD.md # 1), NOT the test
# lane's bookworm. The QEMU test lane pins bookworm for its proven LUKS/TPM
# path; the shipping cloud image tracks the locked stable base.
Release=trixie

[Output]
Format=disk
ImageId=moose-cloud
OutputDirectory=../../.dev/cloud
# Emit a JSON package manifest next to the image so the build can assert the
# package set matches the checked-in expected-packages.txt exactly (the lean
# guard, #238) without mounting the image — bootstrap.sh parses it post-build.
ManifestFormat=json

[Build]
CacheDirectory=../../.dev/cloud/cache
# Side "tools" image carrying a recent systemd (incl. systemd-repart, which
# mkosi uses to lay down the GPT disk even with default partitioning), so the
# build works on hosts whose own systemd is too old. Same pattern as the test
# lane; adds ~2 min to the first build, cached after.
ToolsTree=default
# Pin the tools tree to trixie (now a stable release) instead of mkosi's default
# `testing`. Since trixie promoted to stable (2025-08), `testing` floats into the
# next unstable suite, where a broken systemd postinst now fails the tools-tree
# bootstrap (`dpkg ... systemd ... error code 1`). trixie matches the product
# Release above and gives the tools tree a stable, reproducible package set.
ToolsTreeRelease=trixie

[Content]
# Pin apt recommends OFF for the whole build. mkosi maps this straight to
# `-o APT::Install-Recommends=false`; leaving it unset rides on mkosi's default,
# which a moving dev build silently re-enabled and pulled `nftables` in as
# `iptables`' (docker-ce's hard dep) recommend, breaking the lean check (#237).
# Pinning restores the leanness this profile shipped with (#218) and keeps the
# explicit-listing of the recommend-only deps below (tzdata)
# the *only* way those reach the image — not a coincidence of defaults.
WithRecommends=no
# GRUB on both firmwares (#561, BUILD.md # 1b # Boot; DECISIONS.md 2026-10-01).
# The A/B slot switch and its automatic revert are RAUC's GRUB backend, and they
# must work the same under UEFI (Hetzner CPX) and legacy BIOS (Hetzner CX,
# #277), so GRUB is the boot loader for both: x86_64-efi on the ESP, and
# i386-pc as core.img in the BIOS boot partition (mkosi.repart/05-bios.conf).
# Both read one grub.cfg (mkosi.extra/efi/grub/grub.cfg) and one grubenv on the
# ESP. grub.cfg boots the kernel and initramfs from inside the chosen slot, so
# no UKI: UnifiedKernelImages=no.
#
# Bootable=auto, not yes, and on purpose. mkosi installs GRUB either way. But
# with "yes" it also wants a kernel in /usr/lib/modules to copy to the ESP with
# its own initrd and menu entries, and it fails the build when there is none.
# The postinst moves the kernel into the slot's /usr/lib/moose/boot/ instead,
# so the ESP holds no kernel at all and stays small (mkosi.repart/00-esp.conf).
# The slot's own initramfs (Debian's initramfs-tools, built in the postinst) is
# the one that boots; mkosi's KernelModulesInitrd and KernelCommandLine
# settings would only shape the entries it no longer writes, so they are gone.
# The command line lives in grub.cfg.
Bootable=auto
Bootloader=grub
BiosBootloader=grub
UnifiedKernelImages=no

# The lean cloud-VM minimum (ENVIRONMENT.md # Assumption inventory). Explicitly
# NOT here (the cuts — kept out by bootstrap.sh's exact-match guard against expected-packages.txt):
# network-manager, avahi-daemon/avahi-utils, samba, mergerfs, cryptsetup,
# tpm2-tools. What is NOT a cut any more is SSH: hosted boxes carry
# openssh-server (see Packages below). Public exposure of anything else stays the
# cloud provider's security-group concern (DECISIONS.md 2026-06-19).
Packages=
        linux-image-amd64
        systemd
        systemd-sysv
# GRUB for both firmwares (#561; Bootloader=grub + BiosBootloader=grub above).
# grub-common carries grub-mkimage and grub-editenv (RAUC's GRUB backend calls
# it); grub-pc-bin the i386-pc modules and grub-bios-setup (Debian installs it
# at /usr/lib/grub/i386-pc/grub-bios-setup, where mkosi looks); grub-efi-amd64-bin
# the x86_64-efi modules. systemd-boot left the image with #561.
        grub-common
        grub-pc-bin
        grub-efi-amd64-bin
# RAUC with its slot config (/etc/rauc/system.conf). Debian splits it in two:
# `rauc` is the client, and `rauc-service` the D-Bus daemon that `rauc status`
# and `rauc install` talk to (the spike found this, ab-update-engine-spike.md).
# Nothing installs a bundle yet (#562, #563).
        rauc
        rauc-service
# mkfs.ext4 and e2fsck for the state partition: systemd-repart formats it at
# first boot, and state-setup checks it before every mount. The image had no
# e2fsprogs before #561, because the build host makes the root's ext4.
        e2fsprogs
# systemd-repart, run in the initramfs on every boot (/usr/lib/moose/state-setup)
# against /usr/lib/repart.d/: it makes slot B and the state partition at first
# boot and grows the state partition when the provider disk grew. On trixie the
# binary is its own package.
        systemd-repart
        ca-certificates
        dbus
        util-linux
        kmod
        udev
        iproute2
        sudo
# SSH (#467). Hosted SSH is a per-account opt-in with a public key as the
# MANDATORY factor (AUTH.md # Device access, DECISIONS.md 2026-09-09), so the
# image must carry the daemon — the old "no openssh on hosted" cut is reversed.
#
# It is installed and NOT started at boot. Debian's postinst enables ssh.service,
# and mkosi.postinst.chroot undoes that: the brain starts the unit when the first
# account turns SSH on and stops it when the last one turns it off (BUILD.md
# # SSH). On hosted this matters more than anywhere else — there is no moose
# firewall and the provider attaches none, so the daemon's run state is the ONLY
# thing that closes :22 (ENVIRONMENT.md # Access & files).
#
# Debian trixie does NOT enable ssh.socket on install (only ssh.service gets a
# multi-user.target.wants link), so the service unit is the whole port control.
# openssh-server pulls openssh-client + openssh-sftp-server + adduser and a
# handful of libs; all of them are listed in expected-packages.txt so the lean
# check stays exact.
        openssh-server
# Shadow utilities (useradd/groupadd/usermod/gpasswd/chpasswd). REQUIRED, and easy
# to miss. On the appliance/medium image these arrive transitively (the
# network-manager / avahi postinsts pull adduser+passwd), and since #467 the hosted
# image's openssh-server pulls adduser too — but adduser is not passwd, and nothing
# here Depends on passwd itself. Listing it explicitly is what guarantees it.
# Without it docker-ce's postinst (`groupadd docker`) fails the build, and at
# runtime host-agent's user management (useradd/chpasswd/gpasswd for /setup +
# user CRUD — USERS_AND_GROUPS.md) and the moose-identity provisioning in the
# boot-proof postinst have no tools.
        passwd
        bash
        less
        grep
        sed
        gawk
        coreutils
# Time-zone database. REQUIRED for the first-run wizard's time-zone step: that
# step is a real pass-through to host-agent `timedatectl set-timezone`, which
# rejects any zone not present under /usr/share/zoneinfo. systemd only *Recommends*
# tzdata and we pin recommends off (WithRecommends=no above), so without listing it
# explicitly the lean image ships no zoneinfo and the wizard's tz step 502s on a
# real hosted box (surfaced by the cloud end-to-end test, #209/C5).
        tzdata
# Docker — the control plane and apps run on it — from Docker's official apt
# repo (BUILD.md # Docker package source), wired in via the auto-detected
# mkosi.pkgmngr/ tree that bootstrap.sh populates with Docker's sources.list +
# signing key (trixie pocket). Build-time repo only; the VM never apt-installs.
# The exact versions are pinned in dev/os-lock/third-party.lock (#560); keep this
# list and that file in step (dev/os-lock/oslock's test checks both ways).
        docker-ce
        docker-ce-cli
        containerd.io
        docker-compose-plugin

# Bake the profile marker. /etc/moose/profile = "hosted" is exactly the file
# the brain reads at startup (#202/C1a, internal/profile.Read) to select the
# hosted seams (e.g. skip mDNS publish). A static one-line file committed under
# mkosi.extra/.
#
# Also carries the container-logging wiring, which is load-bearing and easy to
# miss because JSON takes no comments. /etc/docker/daemon.json sets Docker's
# daemon-wide log driver to journald (LOGGING.md # Docker daemon uses the
# `journald` log driver). host-agent-real's per-app log tail runs
# `journalctl CONTAINER_NAME=<container>` (internal/hostagent/journalsource),
# and CONTAINER_NAME is a field ONLY the journald driver sets — under Docker's
# default json-file driver that match returns nothing and the dashboard's Logs
# tab hangs on "Waiting for log output…" forever, for every app. The paired
# docker.service.d/10-moose-logging.conf drop-in lifts journald's per-unit rate
# limit for dockerd, because that routing puts every container on docker.service's
# single budget (LOGGING.md # Tuning).
ExtraTrees=mkosi.extra
# The first-boot runtime wiring (#242): the slim host-agent + its units, the baked
# control-plane image bundle + loader, the control-plane compose, the PAM stack,
# and the provisioning-seed materializer. GENERATED (gitignored) by
# dev/cloud/stage-control-plane.sh, which both this lean build (bootstrap.sh) and
# the boot-proof test lane (test/bootstrap.sh) call — so the test image, which
# Include=..'s this config, validates the exact production wiring. The first-boot
# enablement that consumes these (enable units, NIC DHCP, identities, mask
# firstboot) is dev/cloud/mkosi.postinst.chroot, auto-detected for both lanes.
ExtraTrees=mkosi.extra.wiring

# The A/B layout (#561, BUILD.md # 1b # Partition layout). mkosi.repart/ is the
# BUILD-TIME layout: the ESP (128 MiB), the BIOS boot partition (1 MiB) and
# slot A, a fixed 1 GiB read-only squashfs (xz), unencrypted (# Storage:
# encryption-at-rest is provider/KMS-keyed). It is REQUIRED, not optional: with
# no repart definitions systemd-repart grows the root to fill the whole build
# disk. The build fails when the squashfs fills more than 60% of the slot
# (dev/cloud/slotbudget, run by bootstrap.sh and test/bootstrap.sh).
#
# The RUNTIME layout is mkosi.extra/usr/lib/repart.d/. systemd-repart reads it
# in the initramfs on every boot (/usr/lib/moose/state-setup): it adds slot B
# (1 GiB, empty) and the state partition (the rest of the disk, ext4) at first
# boot, and grows the state partition when the provider disk grew. The root
# never grows; the state partition does, and everything the box writes lives
# there (ENVIRONMENT.md # Storage (hosted)).

# Root password intentionally unset (mkosi leaves /etc/shadow with no password).
# There is no interactive console login surface in hosted v1 (SSH off; operator
# access is a hosting concern); admin identity is PAM/dashboard (#206/C3a).

[Runtime]
# Documentation only. The real qemu invocation + boot proof (#205/C2) lives in
# dev/cloud/run-cloud-tests.sh, which boots an instrumented superset of this lean
# image (dev/cloud/test/, Include=..) — not this config directly.
KVM=yes
RAM=1G
