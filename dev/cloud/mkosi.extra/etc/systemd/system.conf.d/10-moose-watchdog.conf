# A slot that hangs must still revert (UPDATES.md # 1): systemd feeds the
# hardware watchdog, and a hung PID 1 or kernel gets a reset. Hetzner Cloud VMs
# (QEMU q35) have the ICH9 TCO watchdog, which the generic kernel's iTCO_wdt
# drives; the reset comes about twice this value after the last feed
# (BUILD.md # 1b # As built). The boot lane checks systemd uses it.
[Manager]
RuntimeWatchdogSec=60s
