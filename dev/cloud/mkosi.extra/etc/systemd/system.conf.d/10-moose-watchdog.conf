# A slot that hangs must still revert (UPDATES.md # 1): where the machine has a
# hardware watchdog, systemd feeds it, and a hung PID 1 gets a reset. On a
# machine with none (the QEMU lane; Hetzner is not known yet, NEXT.md # A/B OS
# image point 3), systemd logs that and carries on.
[Manager]
RuntimeWatchdogSec=60s
