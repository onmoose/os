# A slot that hangs must still revert (UPDATES.md # 1). Nobody sits at a
# hosted box's console, and the root account is locked, so the stock
# emergency shell waits for ever and boot counting never gets a second boot.
# Reboot instead, after 10 s so the reason reaches the serial console.
[Service]
ExecStartPre=
ExecStart=
ExecStart=-/bin/sh -c 'echo "moose: rescue mode, rebooting in 10 s" > /dev/console; sleep 10; exec /usr/bin/systemctl --no-block reboot'
