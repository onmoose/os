# RAUC slot config for the hosted A/B image (BUILD.md # 1b). The bundle and the
# keyring are built (#562); the install and mark-good are #563.
[system]
compatible=moose-hosted-x86_64
bootloader=grub
grubenv=/efi/grub/grubenv
# On the state partition (a bind mount, BUILD.md # 1b), so RAUC's status
# survives a slot swap.
data-directory=/var/lib/rauc
bundle-formats=-plain

# The CA a bundle's signer must chain to (#562, BUILD.md # 1b # The bundle).
# keyring.pem is not in this tree: dev/cloud/stage-control-plane.sh stages it
# into the generated wiring tree. An image built to publish carries the
# release root (dev/release/rauc/release-ca.pem); every other build carries a
# throwaway root (dev/cloud/rauc.sh). A relative path is read next to this
# file. The signer carries the codeSigning purpose (dev/release/rauc-ca.sh);
# without check-purpose RAUC asks for the S/MIME purpose and refuses it.
[keyring]
path=keyring.pem
check-purpose=codesign

# A slot holds a read-only squashfs (BUILD.md # 1b), which RAUC writes to the
# partition as it is, block for block: type=raw.
[slot.rootfs.0]
device=/dev/disk/by-partuuid/20202020-2020-4020-8020-202020202020
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partuuid/21212121-2121-4121-8121-212121212121
type=raw
bootname=B
