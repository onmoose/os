# RAUC slot config for the hosted A/B image (BUILD.md # 1b). The update itself
# is not built yet: #562 adds the bundle and its keyring (/etc/rauc/keyring.pem,
# [keyring] below), #563 the install and mark-good. With no keyring, `rauc
# status` works and `rauc install` refuses every bundle.
[system]
compatible=moose-hosted-x86_64
bootloader=grub
grubenv=/efi/grub/grubenv
# On the state partition (a bind mount, BUILD.md # 1b), so RAUC's status
# survives a slot swap.
data-directory=/var/lib/rauc
bundle-formats=-plain

# A slot holds a read-only squashfs (BUILD.md # 1b), which RAUC writes to the
# partition as it is, block for block: type=raw.
[slot.rootfs.0]
device=/dev/disk/by-partuuid/20202020-2020-4020-8020-202020202020
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partuuid/21212121-2121-4121-8121-212121212121
type=raw
bootname=B
