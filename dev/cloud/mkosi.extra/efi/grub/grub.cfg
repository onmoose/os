# moose A/B boot (BUILD.md # 1b # Boot). One config for UEFI and legacy BIOS:
# GRUB x86_64-efi (from the ESP) and GRUB i386-pc (core.img in the BIOS boot
# partition) both read this file and the grubenv beside it.
#
# Slot choice is RAUC's GRUB backend, close to RAUC's reference script
# (contrib/grub.conf): take the first slot in ORDER with <slot>_OK=1 and
# <slot>_TRY=0, and set its TRY to 1 before booting it. A booted slot that is
# healthy clears TRY with `rauc status mark-good` (#563). A slot that never
# gets there keeps TRY=1, so the next boot skips it. One attempt per update.
#
# Until #563 nothing marks a slot good, so slot A's TRY is set on one boot and
# reset by the fallback below on the next: the box always boots slot A.
#
# This file is the whole menu: the ESP holds no kernel, so mkosi adds no
# entries of its own (dev/cloud/mkosi.conf, Bootable=auto).
set timeout=0
set default=0

insmod regexp
insmod loadenv
insmod test
# Each slot is a squashfs compressed with xz (dev/cloud/mkosi.repart/
# 10-slot-a.conf). squash4 with xzio is how GRUB reads the kernel and the
# initramfs from inside it. The modules come from the ESP, under the prefix.
insmod part_gpt
insmod squash4
insmod xzio

# $root is the ESP here. Its disk is the boot disk, whatever the firmware calls
# it, so the slots are partitions 3 and 4 of that same disk.
regexp --set=1:moose_disk '^([^,]+),' "$root"

set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
load_env

set moose_found=0
for SLOT in $ORDER; do
    if [ "$SLOT" == "A" ]; then
        INDEX=0
        OK=$A_OK
        TRY=$A_TRY
        A_TRY=1
    fi
    if [ "$SLOT" == "B" ]; then
        INDEX=1
        OK=$B_OK
        TRY=$B_TRY
        B_TRY=1
    fi
    if [ "$OK" -eq 1 -a "$TRY" -eq 0 ]; then
        default=$INDEX
        moose_found=1
        break
    fi
done

# No slot is left to try. RAUC's script falls to a rescue slot here; there is
# none, so boot the known-good slot rather than stop at a GRUB prompt that
# nobody will ever see. The known-good slot is the LAST good slot in ORDER:
# an install puts the new slot first and the slot it came from last. Only that
# slot's attempt is reset. A slot that failed keeps its TRY=1, so it is never
# booted again until a new install into it resets the flag (#563). Today slot
# B is empty (B_OK=0), so this falls back to slot A.
if [ "$moose_found" -eq 0 ]; then
    moose_fallback=""
    for SLOT in $ORDER; do
        if [ "$SLOT" == "A" -a "$A_OK" -eq 1 ]; then moose_fallback=A; fi
        if [ "$SLOT" == "B" -a "$B_OK" -eq 1 ]; then moose_fallback=B; fi
    done
    if [ "$moose_fallback" == "A" ]; then A_TRY=0; default=0; fi
    if [ "$moose_fallback" == "B" ]; then B_TRY=0; default=1; fi
fi

save_env A_TRY A_OK B_TRY B_OK ORDER

# ro: a slot is never written by the box. psi=1 for the ram-pressure detector
# (BUILD.md # 1 # Kernel cmdline). panic=10: a kernel panic, or a failure in
# the initramfs, reboots after 10 s instead of waiting for ever (UPDATES.md # 1
# "a slot that hangs must still revert"). fsck.mode=skip: the slot is a
# read-only squashfs with nothing to check, and the initramfs would otherwise
# try to fsck it and stop; state-setup checks the state partition itself
# (e2fsck -p) before it mounts it. console=ttyS0 last, so /dev/console is the
# serial port the provider captures.
set moose_cmdline="ro console=tty0 console=ttyS0 psi=1 panic=10 fsck.mode=skip"

menuentry "moose slot A" {
    set root=($moose_disk,gpt3)
    linux /usr/lib/moose/boot/vmlinuz root=PARTUUID=20202020-2020-4020-8020-202020202020 $moose_cmdline rauc.slot=A
    initrd /usr/lib/moose/boot/initrd.img
}

menuentry "moose slot B" {
    set root=($moose_disk,gpt4)
    linux /usr/lib/moose/boot/vmlinuz root=PARTUUID=21212121-2121-4121-8121-212121212121 $moose_cmdline rauc.slot=B
    initrd /usr/lib/moose/boot/initrd.img
}
