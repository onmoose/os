# moose's own system users and groups (BUILD.md # 1b, rule 3). From
# sysusers.d, never from useradd at build time: the box's /etc/passwd is in
# the /etc overlay's upper layer once it has changed, so a user a new image
# added with useradd would be hidden. systemd-sysusers adds any that are
# missing on every boot.
#
# moose (3000) is the primary group of every box user (FIRST_RUN.md #
# Identity). moose-app (2000) and moose-shared (2001) are the app-runtime
# identities host-agent resolves by name (APP_ISOLATION.md # Runtime identity).
# moose-remap owns Docker's userns-remap range in /etc/subuid and /etc/subgid
# (BUILD.md # User-namespace remap); its own id does not matter.
g moose        3000
g moose-app    2000
g moose-shared 2001
u moose-app    2000:moose-app "moose app runtime" /nonexistent /usr/sbin/nologin
u moose-remap  -                "moose userns-remap range owner" /nonexistent /usr/sbin/nologin
