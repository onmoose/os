# Slot B. Not in the image: made empty at first boot, right after slot A, at
# the same fixed 4 GiB. The first OS update writes it (RAUC, #563). The
# PARTUUID is pinned because RAUC's system.conf and grub.cfg name it.
[Partition]
Type=root
Label=moose-slot-b
UUID=21212121-2121-4121-8121-212121212121
SizeMinBytes=4G
SizeMaxBytes=4G
