# Runtime layout, read by systemd-repart in the initramfs on every boot
# (/usr/lib/moose/state-setup; BUILD.md # 1b). These first three match the
# partitions the image already has, by type and in order, and change nothing.
# The build-time layout is dev/cloud/mkosi.repart/.
[Partition]
Type=esp
SizeMinBytes=128M
SizeMaxBytes=128M
