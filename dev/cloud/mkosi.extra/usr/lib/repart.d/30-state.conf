# The state partition: everything the box writes that must outlive a slot
# swap (BUILD.md # 1b). Made and formatted at first boot. It has no size cap,
# so it takes the rest of the disk, and when the provider disk grows repart
# extends it on the next boot; state-setup then grows the ext4 inside it with
# systemd-growfs. This replaces moose-grow-root: the root no longer grows.
# linux-generic, not the "var" type, so systemd's gpt-auto never mounts it on
# its own.
[Partition]
Type=linux-generic
Label=moose-state
Format=ext4
