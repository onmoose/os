# CI gate for the Go brain layer: full test pyramid + vet + build.
# The CI realization of the fast Go layers in docs/specs/TESTING.md.
#
# Triggers on PRs into dev or main, and only when Go-relevant files change
# (path filter) — docs-only / web-only PRs don't spin a runner. `dev` is the
# default branch and gates ordinary feature PRs; `main` gates the dev->main
# PR that cuts a release, so a release can't merge ungated. PR-only by
# design: every change lands via PR, so a push trigger would just
# double-run.
#
# DEFERRED — not wired here (issue #14 follow-up): the medium/slow boot lanes
# (`make test-boot-chain-nspawn`, `make test-medium-qemu`) need privileged
# runners (systemd-nspawn, QEMU+swtpm), coordinated with the 0023 track.
name: CI / Go

on:
  pull_request:
    # hotfix/** gates an OS lock bump into a patch-release branch (#560).
    branches: [dev, main, "hotfix/**"]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "VERSION"
      - "api/**"
      # The lock files have no .go in them, but dev/os-lock/oslock's test checks
      # they fit together, so a lock bump PR must run it (#560).
      - "dev/os-lock/**"
      - ".github/workflows/ci-go.yml"

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR branch).
concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go — test + vet + build
    runs-on: ubuntu-latest
    env:
      # msteinert/pam v2.1.0 uses RTLD_NEXT, a GNU extension that needs
      # _GNU_SOURCE at C compile time (see docs/dev/running-locally.md and the
      # Makefile). Required to build/test the pamverifier package.
      CGO_CFLAGS: -D_GNU_SOURCE
    steps:
      - uses: actions/checkout@v5

      - name: Install PAM headers
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The committed api/openapi.{json,yaml} must match what the handlers emit.
      # Fails the build if a brain DTO change wasn't regenerated (`make openapi`),
      # keeping the generated TS client honest (BRAIN_UI_PROTOCOL.md # Codegen).
      - name: OpenAPI spec freshness
        run: make openapi-check

      # -v so skipped tests are visible. `go test` without it prints nothing for
      # a skip, which means a test gated on a file/binary/env that CI lacks can
      # skip on every run forever and read as green — indistinguishable from one
      # that passed. That happened in #375: a drift guard pointed at a gitignored
      # path, so it never ran in CI while the PR claimed it did. The verbose log
      # is kept out of the summary; only the skip list below is surfaced.
      - name: Test (full suite incl. pamverifier)
        run: set -o pipefail && make test GOTESTFLAGS=-v 2>&1 | tee /tmp/gotest.log

      # Surface skips, don't fail on them: 22 are legitimate here (root, avahi,
      # NetworkManager, bash). The point is that a NEW silent skip is visible to
      # a reviewer instead of hiding in a green check. Never fails the job —
      # `|| true` on the grep, since no skips at all is a valid outcome.
      - name: List skipped tests
        if: always()
        run: |
          set -euo pipefail
          skips="$(grep -E '^\s*--- SKIP' /tmp/gotest.log || true)"
          # Also to stdout: the job summary is only readable in the web UI, so
          # without this the guard's finding cannot be grepped from the log or
          # seen by anything reading the run programmatically.
          if [ -z "$skips" ]; then
            echo "no skipped tests"
          else
            echo "skipped tests:"
            echo "$skips"
          fi
          {
            echo "### Skipped tests"
            if [ -z "$skips" ]; then
              echo "None."
            else
              echo ""
              echo '```'
              echo "$skips"
              echo '```'
              echo ""
              echo "A skip is fine when it guards a real environment gap (root, avahi, NetworkManager, bash)."
              echo "A skip guarding something that always exists — a tracked file — is a no-op, not coverage."
              echo "See docs/dev/code-review.md # 6."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
