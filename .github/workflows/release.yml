# Auto-tag `main` when a merge bumps a version file, and, only on that bump,
# cut that line's release: a GitHub Release whose notes are the release PR's own
# body plus the generated commit list, then the hosted cloud-image build, which
# publishes what that line ships.
#
# TWO version lines, one per update stream (BUILD.md # Versioning,
# DECISIONS.md 2026-10-01), decided independently on every push:
#
#   - `VERSION` -> git tag `vX.Y.Z`, the moose (OS) release. Publishes the disk
#     image, attached to the `vX.Y.Z` GitHub Release.
#   - `CONTROL_PLANE_VERSION` -> git tag `control-plane-vX.Y.Z`, the control
#     plane (moose-brain + moose-ui). Publishes the two ghcr images, tagged
#     `vX.Y.Z` (+ `latest`) with the control-plane number: that image tag shape
#     is what the private control plane resolves digests by, so only the git tag
#     and the GitHub Release carry the `control-plane-` prefix. Its GitHub
#     Release is created with `--latest=false`, so GitHub's "Latest release" (and
#     its download link) stays on the OS release and its disk image.
#
# A bump of either file IS that line's release trigger (`docs/dev/contributing.md`
# # Release model). A merge that bumps both cuts both, in one cloud-image run. A
# merge that bumps neither is a silent no-op: this workflow still runs, sees both
# tags already exist, and exits clean. That no-op MUST stay green, not red: most
# merges to main won't bump anything, and a red run on every ordinary merge
# trains people to ignore this workflow's status.
#
# The decision per line lives in dev/release/decide.sh, so it can be tested off
# main (dev/release/decide_test.go runs it against throwaway git repos in
# `make check`). It has three outcomes (release, no-op, hard error for a bump to
# an already-tagged version) and, for the control plane, refuses a version whose
# ghcr image tag is already published, so a release never overwrites released
# images with new bytes under the same number.
#
# Ordering: tags + GitHub Releases FIRST, image build+publish SECOND. Rationale
# (deliberately chosen over the reverse):
#   - A git tag names a source commit's version; it doesn't assert "and an
#     image was published from it." Those are separable facts.
#   - If the tag/release step ran AFTER a successful image build instead, a
#     build failure, or the runner dying mid-build, would leave NO tag and NO
#     release for a commit whose version file was already bumped and merged to
#     main. The next push to main would retry the SAME build every time until it
#     succeeds, or a following bump would race past the stuck one and the
#     earlier version would simply never get tagged.
#   - Tagging first means a failed/slow image build is a visibly separate,
#     independently retriable problem (invoke `ci-cloud-image.yml` directly via
#     workflow_dispatch against the tagged commit), without it blocking the
#     source-level fact that the version exists and what commit it points at.
#
# THE TRAP this design avoids: a tag pushed with the default GITHUB_TOKEN does
# NOT fire another workflow's `push: tags` trigger. GitHub suppresses events
# from GITHUB_TOKEN-authored pushes to prevent recursive workflow runs. So this
# workflow does NOT rely on `ci-cloud-image.yml`'s `push: tags: v*` trigger
# picking up the tag it pushes (it would silently never build or publish).
# Instead it CALLS `ci-cloud-image.yml` directly as a reusable workflow
# (`workflow_call`) with one publish switch per line. `ci-cloud-image.yml`'s
# `push: tags` trigger is kept alongside `workflow_call` as the manual escape
# hatch for a human pushing an OS tag by hand; because the GITHUB_TOKEN tag push
# here never fires it, the two paths cannot double-build the same release. See
# the header comment on `ci-cloud-image.yml` for the full reasoning.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# One release decision in flight for main at a time; don't cancel a run that
# might already be mid-tag/mid-release — a cancelled tag-push or release-create
# left half-done is worse than a queued wait.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tag:
    name: Tag + GitHub Release (only for a bumped version file)
    runs-on: ubuntu-latest
    # `contents: write` to push the tags and create the Releases, and
    # `pull-requests: read` to look up the release PR whose body becomes the
    # Release notes. Set at job level: the workflow-level grant is
    # `contents: write` only, which leaves every other scope at `none`.
    permissions:
      contents: write
      pull-requests: read
    outputs:
      os_created: ${{ steps.decide.outputs.os_created }}
      os_tag: ${{ steps.decide.outputs.os_tag }}
      cp_created: ${{ steps.decide.outputs.cp_created }}
      cp_tag: ${{ steps.decide.outputs.cp_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags: the decision compares each version file against
          # the previous main commit and resolves where an existing tag points.
          # The default depth-1 checkout can do neither.
          fetch-depth: 0

      # Decide both lines before tagging either. If one line is a hard error,
      # nothing is tagged, so a merge that bumps both never half-releases.
      # The control-plane line also checks that its ghcr image tag is not
      # already published (anonymous read; the images are public).
      - name: Decide which lines this merge releases
        id: decide
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ./dev/release/decide.sh VERSION v "$BEFORE" | sed 's/^/os_/' > /tmp/os.out
          RELEASE_IMAGE_CHECK="./dev/release/ghcr-tag-exists.sh ${GITHUB_REPOSITORY_OWNER,,}/brain" \
            ./dev/release/decide.sh CONTROL_PLANE_VERSION control-plane-v "$BEFORE" | sed 's/^/cp_/' > /tmp/cp.out
          cat /tmp/os.out /tmp/cp.out | tee -a "$GITHUB_OUTPUT"

      # Tag the merge commit and open a GitHub Release, once per line that this
      # merge releases. This uses the default GITHUB_TOKEN, which is exactly why
      # ci-cloud-image.yml cannot rely on its `push: tags` trigger to notice the
      # tag (see the header comment above and on ci-cloud-image.yml).
      #
      # The release PR's body becomes the Release notes, with the generated
      # commit list appended under it (the API appends when both a body and
      # generate_release_notes are sent). The commit list alone is a poor
      # answer to "should I upgrade?". The PR body is where the person cutting
      # the release already wrote that summary, so use it rather than asking
      # them to write it twice. A merge that releases both lines uses the same
      # body for both.
      #
      # It falls back to the generated notes alone when the body is missing or
      # too short to be a summary. The threshold is deliberately low: it only
      # screens out an empty or throwaway body, not a terse but real summary.
      #
      # The generated list starts at the previous tag on the SAME line
      # (`--notes-start-tag`), so a control-plane Release never lists commits
      # since the last OS tag, and the other way round.
      - name: Create tags + GitHub Releases
        if: steps.decide.outputs.os_created == 'true' || steps.decide.outputs.cp_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OS_CREATED: ${{ steps.decide.outputs.os_created }}
          OS_TAG: ${{ steps.decide.outputs.os_tag }}
          OS_PREV: ${{ steps.decide.outputs.os_prev_tag }}
          CP_CREATED: ${{ steps.decide.outputs.cp_created }}
          CP_TAG: ${{ steps.decide.outputs.cp_tag }}
          CP_PREV: ${{ steps.decide.outputs.cp_prev_tag }}
        run: |
          set -euo pipefail

          # The PR this merge came from, if any. A direct push to main has none,
          # which is a normal case here, not an error.
          body="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[0].body // ""' 2>/dev/null || echo "")"
          if [ "${#body}" -ge 200 ]; then
            printf '%s\n' "$body" > /tmp/release-notes.md
            echo "notes: using the release PR body (${#body} chars) with the generated list appended"
          else
            echo "::warning::release PR body is missing or too short (${#body} chars), falling back to generated notes only. Write a summary in the release PR body so the Release page says what changed."
          fi

          release() { # TAG PREV [extra gh args...]
            local tag="$1" prev="$2"; shift 2
            local args=(--title "$tag" --target "$GITHUB_SHA" --generate-notes "$@")
            if [ -n "$prev" ]; then args+=(--notes-start-tag "$prev"); fi
            if [ -f /tmp/release-notes.md ]; then args+=(--notes-file /tmp/release-notes.md); fi
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
            gh release create "$tag" "${args[@]}"
          }

          # The OS release keeps GitHub's automatic "Latest" choice: it is the
          # one with the disk image a person downloads. The control-plane
          # Release never takes "Latest".
          if [ "$OS_CREATED" = "true" ]; then release "$OS_TAG" "$OS_PREV"; fi
          if [ "$CP_CREATED" = "true" ]; then release "$CP_TAG" "$CP_PREV" --latest=false; fi

      - name: Step summary
        env:
          OS_CREATED: ${{ steps.decide.outputs.os_created }}
          OS_TAG: ${{ steps.decide.outputs.os_tag }}
          CP_CREATED: ${{ steps.decide.outputs.cp_created }}
          CP_TAG: ${{ steps.decide.outputs.cp_tag }}
          CP_VERSION: ${{ steps.decide.outputs.cp_version }}
        run: |
          {
            if [ "$OS_CREATED" = "true" ]; then
              echo "### Released ${OS_TAG} (OS)"
              echo ""
              echo "\`VERSION\` was bumped by this merge. Tag pushed, GitHub Release created, and the disk image will be built and attached by the \`cloud-image\` job."
            else
              echo "### OS: skipped, \`${OS_TAG}\` already exists"
            fi
            echo ""
            if [ "$CP_CREATED" = "true" ]; then
              echo "### Released ${CP_TAG} (control plane)"
              echo ""
              echo "\`CONTROL_PLANE_VERSION\` was bumped by this merge. Tag pushed, GitHub Release created, and the \`cloud-image\` job will push the brain and UI images to ghcr as \`v${CP_VERSION}\` after the boot proof."
            else
              echo "### Control plane: skipped, \`${CP_TAG}\` already exists"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  cloud-image:
    name: Build + publish hosted cloud image
    needs: tag
    # Either line released. A control-plane-only release still builds the disk
    # image and runs the full boot proof, because the images it pushes are the
    # ones baked into that image and proven to boot; it only skips the attach.
    if: needs.tag.outputs.os_created == 'true' || needs.tag.outputs.cp_created == 'true'
    # A called reusable workflow can only NARROW the permissions its caller
    # grants, never widen them. This workflow's top-level `permissions:` is
    # `contents: write` only, which sets every other scope — including
    # `packages` — to `none` for all jobs. So `ci-cloud-image.yml` asking for
    # `packages: write` to push the control-plane images to ghcr (#370) is not
    # enough on its own: without this job-level grant the token it receives
    # here has `packages: none` and the push 403s on every real release.
    #
    # This is the ONLY path a release takes, and it is also the path least
    # likely to be exercised by hand — running `ci-cloud-image.yml` directly
    # via workflow_dispatch works fine, because that run has no caller
    # narrowing it. Granting at the job level rather than workflow level keeps
    # the `tag` job on `contents: write` alone.
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/ci-cloud-image.yml
    with:
      publish_os: ${{ needs.tag.outputs.os_created == 'true' }}
      publish_control_plane: ${{ needs.tag.outputs.cp_created == 'true' }}
    secrets: inherit
